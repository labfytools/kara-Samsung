<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoké — Strawberry</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="connect">
  <img class="logo" src="icon.png" alt="">
  <h1>Kara</h1>
  <p id="hint" role="status">Connexion au serveur Kara…</p>
  <button type="button" id="retry">Réessayer</button>
</section>
<div id="screen" hidden>
<header>
  <img id="album-art" alt="Pochette de l’album" hidden>
  <h1 id="title">Kara</h1>
  <div id="artist"></div>
  <footer id="attribution" hidden></footer>
</header>
<main id="lyrics">
  <div id="timed-lyrics">
    <div id="previous" class="line"></div>
    <div id="current" class="line"><span id="sung"></span><span id="pending">En attente de Strawberry…</span></div>
    <div id="next" class="line"></div>
    <div id="following" class="line"></div>
  </div>
  <div id="plain-lyrics" hidden></div>
</main>
<p id="status" role="status"></p>
</div>
<div id="tv-closed" hidden>
  <h2>Affichage TV fermé</h2>
  <button type="button" id="reopen-tv">Rouvrir l’écran</button>
</div>
<script src="display-config.js"></script>
<script src="app.js"></script>
</body>
</html>
